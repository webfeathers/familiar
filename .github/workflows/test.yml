# The same checks `pnpm test` runs on a laptop, on every pull request and on
# main. Railway deploys main as soon as it changes, so until Railway's
# "Wait for CI" is switched on for both services this reports a bad merge
# rather than blocking it.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: grimalkin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grimalkin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # scripts/test.sh uses this instead of starting its own container, and
      # refuses anything that is not a loopback database with "test" in its name.
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/grimalkin_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
