# Publishes site/ to GitHub Pages at https://webfeathers.github.io/familiar/.
# Images come from docs/assets so the README and the site share one copy.
name: pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/assets/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir -p site/assets && cp docs/assets/familiar-avatar.svg docs/assets/familiar-avatar.png docs/assets/familiar-cat.svg docs/assets/social-preview.png site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
